<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Погружение (v3.0)</title>
<style>
  html, body {
    margin: 0;
    background: #0b1a2a;
    color: #eaf6ff;
    font-family: system-ui, sans-serif;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }
  canvas { display: block; background: #1a3a58; cursor: crosshair; touch-action: none; }

  .overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    z-index: 10;
    background: radial-gradient(circle at 50% 30%, rgba(30, 80, 130, 0.85), rgba(8, 18, 32, 0.96) 70%);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show { display: flex; }

  .panel {
    background: #0e2233;
    border: 1px solid #1e3a55;
    border-radius: 14px;
    padding: 28px 32px;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    text-align: center;
    margin: auto;
  }
  .panel h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 1px; color: #7fd6ff; }
  .panel h2 { margin: 0 0 16px; font-size: 24px; }
  .panel p { font-size: 15px; opacity: 0.85; line-height: 1.55; margin: 8px 0; }

  .version-badge {
    display: inline-block;
    background: rgba(212, 162, 89, 0.2);
    border: 1px solid #d4a259;
    color: #ffd166;
    font-family: monospace;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  /* История ×2 крупнее */
  .story-text {
    text-align: left;
    font-size: 17px;
    line-height: 1.75;
    margin: 20px 0;
    background: #0a1a28;
    border: 1px solid #1e3a55;
    border-left: 5px solid #d4a259;
    border-radius: 10px;
    padding: 20px 24px;
    color: #d8e8f4;
  }
  .story-text b { color: #ffd166; }
  .story-text em { color: #7fd6ff; font-style: normal; }

  .btn {
    display: inline-block;
    padding: 12px 24px;
    margin: 6px;
    background: #1f6feb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    touch-action: manipulation;
    font-family: inherit;
  }
  .btn:hover { background: #2b7fff; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:disabled:hover { background: #1f6feb; }
  .btn.secondary { background: #14324a; border: 1px solid #1e3a55; }
  .btn.secondary:hover { background: #1a3f5c; }
  .btn.gold {
    background: linear-gradient(145deg, #d4a259, #a87c37);
    color: #1a0d00;
    font-weight: 600;
  }
  .btn.gold:hover { background: linear-gradient(145deg, #e5b46b, #b88a40); }
  .btn.danger { background: #7a1f2a; border: 1px solid #b83a4a; }
  .btn.danger:hover { background: #9c2734; }

  .play-btn {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: linear-gradient(145deg, #2b7fff, #1f6feb);
    border: 4px solid #d4a259;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; margin: 24px 0 8px;
    box-shadow: 0 0 0 0 rgba(212, 162, 89, 0.5);
    animation: pulse 2s infinite;
    transition: transform 0.1s;
    touch-action: manipulation;
  }
  .play-btn:hover { transform: scale(1.06); }
  .play-btn:active { transform: scale(0.96); }
  .play-btn svg { margin-left: 6px; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(212, 162, 89, 0.5); }
    70%  { box-shadow: 0 0 0 22px rgba(212, 162, 89, 0); }
    100% { box-shadow: 0 0 0 0 rgba(212, 162, 89, 0); }
  }

  .menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .menu-list .btn { width: 100%; padding: 14px; font-size: 16px; }

  #hud {
    position: absolute; top: 10px; left: 10px;
    font-family: monospace; font-size: 13px;
    background: rgba(7, 19, 32, 0.75);
    padding: 8px 12px; border: 1px solid #1e3a55;
    border-radius: 8px; pointer-events: none; line-height: 1.5;
  }
  #hpbar {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: calc(20px + env(safe-area-inset-left, 0px));
    width: 180px; height: 24px;
    background: rgba(7, 19, 32, 0.85);
    border: 2px solid #1e3a55; border-radius: 8px;
    overflow: hidden; pointer-events: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    z-index: 2;
  }
  #hpfill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #6ee787, #3ddc84);
    transition: width 0.15s linear, background 0.2s;
  }
  #hptext {
    position: absolute;
    bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    left: calc(28px + env(safe-area-inset-left, 0px));
    font-family: monospace; font-size: 13px;
    font-weight: bold;
    pointer-events: none;
    color: #ffffff;
    text-shadow: 0 0 4px #000, 0 0 8px rgba(0,0,0,0.8);
    z-index: 3;
  }

  #hint {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 13px; opacity: 0.8;
    background: rgba(7, 19, 32, 0.75);
    padding: 6px 14px; border-radius: 8px;
    pointer-events: none; white-space: nowrap;
    max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  body.input-touch #hint { display: none; }
  .hidden { display: none !important; }

  #gameControls {
    position: absolute; top: 10px; right: 110px;
    display: flex; gap: 6px;
    z-index: 50;
    pointer-events: auto;
  }
  .gc-btn {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: rgba(7, 19, 32, 0.85);
    border: 1px solid #1e3a55;
    color: #7fd6ff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    font-family: inherit;
    font-size: 18px;
    touch-action: manipulation;
  }
  .gc-btn:hover { background: rgba(20, 50, 74, 0.95); border-color: #2b7fff; }
  .gc-btn:active { transform: scale(0.94); }

  #ctrlPanel {
    position: fixed;
    top: 10px;
    right: 10px;
    display: flex;
    gap: 6px;
    z-index: 300;
  }
  #fsBtn, #winBtn, #muteBtn {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: rgba(7, 19, 32, 0.85);
    border: 1px solid #1e3a55;
    color: #7fd6ff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    font-family: inherit;
    font-size: 20px;
    touch-action: manipulation;
  }
  #fsBtn:hover, #winBtn:hover, #muteBtn:hover {
    background: rgba(20, 50, 74, 0.95); border-color: #2b7fff;
  }
  #fsBtn:active, #winBtn:active, #muteBtn:active { transform: scale(0.94); }
  #fsBtn svg, #winBtn svg { display: block; }

  .player-badge {
    position: absolute; top: 10px; left: 50%;
    transform: translateX(-50%);
    font-family: monospace;
    font-size: 12px;
    background: rgba(7, 19, 32, 0.85);
    padding: 5px 12px;
    border: 1px solid #d4a259;
    border-radius: 20px;
    color: #ffd166;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }

  .row {
    display: flex; justify-content: space-between;
    padding: 6px 0; border-bottom: 1px dashed #1e3a55;
    font-family: monospace; font-size: 14px;
    text-align: left;
  }
  .row:last-child { border-bottom: none; }
  .val { color: #7fd6ff; }
  .good { color: #6ee787; }
  .warn { color: #ffd166; }
  .bad  { color: #ff6b6b; }

  .controls-list {
    text-align: left;
    font-family: monospace;
    font-size: 14px;
    line-height: 1.7;
    margin: 12px 0;
    background: #0a1a28;
    border: 1px solid #1e3a55;
    border-radius: 8px;
    padding: 12px 16px;
  }
  .controls-list b { color: #7fd6ff; }

  .leaderboard {
    width: 100%; border-collapse: collapse; margin: 12px 0;
    font-family: monospace; font-size: 14px;
  }
  .leaderboard th, .leaderboard td {
    padding: 8px 10px; text-align: left; border-bottom: 1px solid #1e3a55;
  }
  .leaderboard th {
    color: #7fd6ff; font-weight: 500; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .leaderboard tr.top1 td { color: #ffd166; font-weight: bold; }
  .leaderboard tr.top2 td { color: #cfd8e0; }
  .leaderboard tr.top3 td { color: #d29060; }
  .leaderboard td.rank { width: 40px; text-align: center; }
  .leaderboard td.score { text-align: right; color: #6ee787; }
  .empty-msg {
    text-align: center; opacity: 0.6; padding: 24px 0; font-style: italic;
  }

  .choice-tabs {
    display: flex; gap: 6px;
    margin: 16px 0 10px;
    background: #0a1a28;
    border: 1px solid #1e3a55;
    border-radius: 10px;
    padding: 4px;
  }
  .choice-tab {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: #7fd6ff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    touch-action: manipulation;
  }
  .choice-tab.active {
    background: linear-gradient(145deg, #2b7fff, #1f6feb);
    color: #ffffff;
  }
  .choice-pane { display: none; }
  .choice-pane.active { display: block; }

  .select-block { text-align: left; margin: 12px 0; }
  .select-block label {
    display: block;
    font-family: monospace;
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 6px;
  }
  .select-block select,
  .select-block input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    background: #0a1a28;
    border: 1px solid #1e3a55;
    border-radius: 8px;
    color: #eaf6ff;
    font-size: 16px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .select-block select:focus,
  .select-block input:focus { outline: none; border-color: #2b7fff; }
  .select-block select:disabled { opacity: 0.5; cursor: not-allowed; }

  #loadingMsg {
    padding: 20px;
    font-family: monospace;
    font-size: 14px;
    color: #7fd6ff;
    text-align: center;
  }

  .selected-preview {
    margin: 12px 0;
    padding: 12px 16px;
    background: rgba(212, 162, 89, 0.15);
    border: 1px solid #d4a259;
    border-radius: 8px;
    font-family: monospace;
    font-size: 15px;
    color: #ffd166;
    text-align: center;
    font-weight: 600;
    letter-spacing: 1px;
  }

  #pauseOverlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(4, 12, 22, 0.85);
    z-index: 200;
    padding: 20px;
  }
  #pauseOverlay.show { display: flex; }
  #pausePanel {
    background: #0e2233;
    border: 1px solid #1e3a55;
    border-radius: 14px;
    padding: 32px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    max-width: 400px;
    width: 100%;
  }
  #pausePanel h2 { margin: 0 0 20px; color: #7fd6ff; }
  #pausePanel .btn { display: block; width: 100%; margin: 8px 0; }

  .game-toast {
    position: fixed;
    bottom: 76px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.9);
    color: #7fd6ff;
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    z-index: 400;
    font-family: monospace;
    pointer-events: none;
    white-space: nowrap;
    border: 1px solid #2b7fff;
    animation: toastFade 2.2s ease forwards;
  }
  @keyframes toastFade {
    0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
  }

  .server-status {
    position: fixed;
    bottom: 14px;
    right: 14px;
    font-family: monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    background: rgba(7, 19, 32, 0.8);
    border: 1px solid #1e3a55;
    z-index: 150;
    pointer-events: none;
  }
  .server-status.online { color: #6ee787; border-color: #6ee787; }
  .server-status.offline { color: #ff6b6b; border-color: #ff6b6b; }
  .server-status.checking { color: #ffd166; border-color: #ffd166; }

  /* Прогресс-бар в меню */
  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(7, 19, 32, 0.8);
    border: 1px solid #1e3a55;
    border-radius: 4px;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #d4a259, #ffd166);
    transition: width 0.3s;
  }

  /* МОТОР — слева, прозрачный */
  #thrustButton {
    display: none;
    position: fixed;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    left: calc(26px + env(safe-area-inset-left, 0px));
    z-index: 60;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    opacity: 0.35;
    transition: opacity 0.3s;
  }
  body.input-touch #thrustButton:not(.hidden) { display: block; }
  #thrustButton:active,
  #thrustButton.active { opacity: 0.85; }

  #thrustBtn {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #ff9a6a, #c9482a);
    border: 3px solid #ffd166;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-family: monospace;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    box-shadow: 0 0 34px rgba(255, 120, 60, 0.45);
    transition: transform 0.08s, box-shadow 0.08s, background 0.08s;
    padding: 0;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  #thrustBtn svg {
    width: 38px; height: 38px;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    pointer-events: none;
  }
  #thrustBtn .label { pointer-events: none; font-size: 11px; opacity: 0.95; }
  #thrustBtn.active {
    transform: scale(0.94);
    background: radial-gradient(circle at 38% 35%, #ffd166, #ff6a3a);
    border-color: #ffffff;
    box-shadow: 0 0 50px rgba(255, 200, 80, 0.95);
  }

  /* Стик — справа, прозрачный */
  #mobileControls {
    display: none;
    position: fixed;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    right: calc(26px + env(safe-area-inset-right, 0px));
    width: 150px; height: 150px;
    z-index: 60;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    opacity: 0.35;
    transition: opacity 0.3s;
  }
  body.input-touch #mobileControls:not(.hidden) { display: block; }
  #mobileControls:active,
  #mobileControls.active { opacity: 0.85; }

  #joystickBase {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(7, 19, 32, 0.5);
    border: 2px solid rgba(127, 214, 255, 0.4);
    box-shadow: inset 0 0 24px rgba(127, 214, 255, 0.15);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: border-color 0.15s, background 0.15s;
    touch-action: none;
  }
  #joystickBase.active {
    border-color: #7fd6ff;
    background: rgba(20, 50, 74, 0.65);
  }
  #joystickKnob {
    position: absolute;
    width: 62px; height: 62px;
    left: 50%; top: 50%;
    margin-left: -31px; margin-top: -31px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #a4dfff, #4a9edb);
    border: 2px solid #7fd6ff;
    box-shadow: 0 0 22px rgba(127, 214, 255, 0.6);
    pointer-events: none;
    will-change: transform;
    transition: box-shadow 0.15s;
  }
  #joystickBase.active #joystickKnob {
    box-shadow: 0 0 34px rgba(127, 214, 255, 0.95);
  }

  /* Portrait warning — только для мобильных */
  #portraitWarning {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0b1a2a;
    z-index: 500;
    text-align: center;
    padding: 20px;
  }
  #portraitWarning.show { display: flex; }
  #portraitWarning .content {
    max-width: 320px;
  }
  #portraitWarning .rot-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: rotatePhone 2s infinite;
    display: inline-block;
  }
  @keyframes rotatePhone {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(-90deg); }
    50%  { transform: rotate(-90deg); }
    75%  { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  #portraitWarning h2 { color: #7fd6ff; font-size: 22px; margin: 0 0 12px; }
  #portraitWarning p { color: #d8e8f4; font-size: 15px; opacity: 0.85; }

  @media (max-width: 700px) {
    #hud { font-size: 11px; padding: 5px 8px; }
    #gameControls { right: 110px; }
    .gc-btn { width: 38px; height: 38px; font-size: 16px; }
    .player-badge { font-size: 11px; padding: 4px 10px; }
    #mobileControls { width: 132px; height: 132px; }
    #joystickKnob { width: 56px; height: 56px; margin-left: -28px; margin-top: -28px; }
    #thrustBtn { width: 116px; height: 116px; }
    #thrustBtn svg { width: 34px; height: 34px; }
    .panel { padding: 22px 20px; }
    .panel h1 { font-size: 26px; }
    .panel h2 { font-size: 19px; }
    #fsBtn, #winBtn, #muteBtn { width: 40px; height: 40px; font-size: 18px; }
    #hpbar {
      width: 150px; height: 22px;
      bottom: calc(160px + env(safe-area-inset-bottom, 0px));
    }
    #hptext {
      font-size: 12px;
      bottom: calc(163px + env(safe-area-inset-bottom, 0px));
    }
    #thrustButton { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
  }

  @media (max-width: 500px) {
    #hud { font-size: 10px; }
    #gameControls { right: 100px; gap: 4px; }
    .gc-btn { width: 34px; height: 34px; font-size: 14px; }
    #mobileControls {
      width: 120px; height: 120px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      right: calc(16px + env(safe-area-inset-right, 0px));
    }
    #thrustButton {
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
    }
    #thrustBtn { width: 104px; height: 104px; font-size: 11px; }
    #thrustBtn svg { width: 30px; height: 30px; }
    #joystickKnob { width: 52px; height: 52px; margin-left: -26px; margin-top: -26px; }
    .play-btn { width: 100px; height: 100px; }
    #fsBtn, #winBtn, #muteBtn { width: 36px; height: 36px; font-size: 16px; }
    #hpbar {
      width: 130px; height: 20px;
      bottom: calc(135px + env(safe-area-inset-bottom, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
    }
    #hptext {
      font-size: 11px;
      bottom: calc(138px + env(safe-area-inset-bottom, 0px));
      left: calc(24px + env(safe-area-inset-left, 0px));
    }
  }
</style>
</head>
<body>
